<!doctype html>
<html>
<head><meta charset="utf-8"><title>Products</title></head>
<body>
  <h1>Products — trang {{ page_obj.number }}/{{ page_obj.paginator.num_pages }}</h1>
  <ul>
    {% for p in products %}
      <li>{{ p.name }} — {{ p.price }}</li>
    {% endfor %}
  </ul>
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}">« Trước</a>{% endif %}
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}">Sau »</a>{% endif %}
</body>
</html>
